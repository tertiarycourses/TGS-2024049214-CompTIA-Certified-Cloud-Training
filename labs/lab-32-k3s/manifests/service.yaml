# Lab 32 — Step 2: Expose the application
# NodePort Service publishing the `web` Deployment on node port 30080,
# which is the port the lab curls (`curl -s http://localhost:30080`).
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
